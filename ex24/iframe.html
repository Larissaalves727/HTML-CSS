<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px dotted black;
        }
    </style>
</head>
<body>
    <H1>Testando uso de um iframe</H1>
    <!--Tamanho padrão do iframe 300 x 150-->
    <p>
        Acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
    
            <a href="https://www.cursoemvideo.com" target="_blank">CursoemVideo</a>
        </iframe> 
        para aprender a programa.</p>

    <p>
        O site do 
        
        <iframe src="https://www.google.com.br" frameborder="0">

        </iframe>
        
        também é muito legal, uma pena que não funciona dentro doiframe
    </p>
    <p>
        O repositório do Guanabara 
        
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">

        <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
        
    </iframe>

        também é bem legal
    </p>
</body>
</html>
