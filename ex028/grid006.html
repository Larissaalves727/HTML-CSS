<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <style>
     .container {
        display: grid;
        grid-template-rows: repeat(3, 100px);
        grid-template-columns: repeat(4, 1fr);
        border:  5px solid yellowgreen;
        gap: 5px;
        
     }
     .caixa1 {
       background-color: red;
        /*grid-row-start: 1;
        grid-row-end: 2;
        grid-column-start: 1;
        grid-column-end: -2;*/

        grid-row: 1/ 2;
        grid-column: 1 / span 3;
     }

     .caixa2 {
        background-color: plum;
        grid-area: 2 / 1/ -1 / 3;
        /* ordem do grid-area row start / collumn start / row end / collumn end */
     }

     .caixa3 {
        background-color: purple;
        grid-row: 2 / -1;
        grid-column: 3 / 5;
     }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
        
    </div>
</body>
</html>
