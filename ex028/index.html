<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio grid</title>
    <style>
        .container {
            background-color: greenyellow;
            display: grid;
            grid-template-rows: 100px 50px 300px 50px;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 5px;
            text-align: center;
            color: white;
        }
        .item1{
            background-color: plum;
           grid-area: 1 / 1 / 2 / -1;
        }
        .item2{
            background-color: plum;
            ;
            grid-area: 2 / 1 / 3 / -1;
            
        }
        .item3{
            background-color: plum;
            grid-area: 3 / 1 / -2 / -2 ;
        }
        .item4{
            background-color: plum;
            grid-area: 3 / -2 / -2 / -1;
        }
        .item5{
            background-color: plum;
           grid-area: -2 / 1 / -1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">topo</div>
        <div class="item2">menu</div>
        <div class="item3">principal</div>
        <div class="item4">secundario</div>
        <div class="item5">rodape</div>
    </div>
</body>
</html>
